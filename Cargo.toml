[package]
name = "multigh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "mgh"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
cliclack = "0.5"
console = "0.16"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"

[[bin]]
name = "mgh"
path = "src/main.rs"

[[bin]]
name = "mgh-git"
path = "src/bin/mgh-git.rs"

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9"
