[package]
name = "multigh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
cliclack = "0.5"
console = "0.16"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"

[[bin]]
name = "mgh"
path = "src/main.rs"
